services:
  pyscripts:
    build:
      context: .
      dockerfile: Dockerfile
    image: pyscripts-control-plane:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYSCRIPTS_UI_DIST_PATH: /app/ui/dist
      PYSCRIPTS_CONTRACT_ARTIFACT_ROOT: /var/lib/pyscripts/contracts
      PYSCRIPTS_GRPC_HOST: 0.0.0.0
      PYSCRIPTS_GRPC_PORT: "50051"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PYSCRIPTS_HTTP_BIND:-127.0.0.1}:${PYSCRIPTS_HTTP_PORT:-8000}:8000"
      - "${PYSCRIPTS_GRPC_BIND:-127.0.0.1}:${PYSCRIPTS_GRPC_HOST_PORT:-50051}:50051"
    volumes:
      - contract_cache:/var/lib/pyscripts/contracts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/catalog', timeout=5).close()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  contract_cache:
