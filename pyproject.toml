[project]
name = "pyscripts"
version = "0.1.0"
description = "A Ray-backed platform for hosting stateless Python services"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "boto3>=1.40.0",
    "fastapi>=0.116.0",
    "grpcio>=1.74.0",
    "grpcio-tools>=1.74.0",
    "packaging>=25.0",
    "protobuf>=6.31.0",
    "pydantic-settings>=2.10.0",
    "ray>=2.58.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "tzdata>=2026.2",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
pyscripts-db = "pyscripts.init_db:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyscripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
