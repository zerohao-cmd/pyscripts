# KubeRay 1.7 / Ray 2.58 execution cluster for pyscripts.
# Deployment guide (including Ray setup): ../../README.md
#
# Apply after installing the KubeRay operator:
#   kubectl apply -k deploy/k8s/overlays/lan
#
# The control-plane deployment should use:
#   PYSCRIPTS_RAY_ADDRESS=ray://pyscripts-ray-head-svc.pyscripts.svc.cluster.local:10001
#   PYSCRIPTS_KUBERAY_CLUSTER_NAME=pyscripts-ray
#   PYSCRIPTS_KUBERNETES_NAMESPACE=pyscripts
#   PYSCRIPTS_RAY_WORKER_POOL_LABEL_KEY=pyscripts.worker-pool

apiVersion: v1
kind: Namespace
metadata:
  name: pyscripts
---
# Read-only identity for the pyscripts API/control-plane Pod. The RayCluster
# itself is managed by the KubeRay operator's service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pyscripts-control-plane
  namespace: pyscripts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pyscripts-raycluster-reader
  namespace: pyscripts
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayclusters"]
    resourceNames: ["pyscripts-ray"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pyscripts-raycluster-reader
  namespace: pyscripts
subjects:
  - kind: ServiceAccount
    name: pyscripts-control-plane
    namespace: pyscripts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pyscripts-raycluster-reader
---
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: pyscripts-ray
  namespace: pyscripts
  labels:
    app.kubernetes.io/name: pyscripts-ray
    app.kubernetes.io/part-of: pyscripts
spec:
  rayVersion: "2.58.0"
  # KubeRay generates a Secret named pyscripts-ray (key: auth_token) and
  # injects matching credentials into Ray and autoscaler containers.
  authOptions:
    mode: token

  # Autoscaler v2 understands Ray label selectors and can scale a worker group
  # from its declared labels before a matching worker is running.
  enableInTreeAutoscaling: true
  autoscalerOptions:
    version: v2
    upscalingMode: Default
    idleTimeoutSeconds: 300
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: "0.0.0.0"
      # Keep user IO actors and Compute tasks off the control-plane node.
      num-cpus: "0"
      # The head only needs a small object store; reserve memory for GCS,
      # Dashboard, Ray Client and runtime environment management.
      object-store-memory: "268435456" # 256Mi
    template:
      metadata:
        labels:
          app.kubernetes.io/component: ray-head
      spec:
        terminationGracePeriodSeconds: 60
        containers:
          - name: ray-head
            image: rayproject/ray:2.58.0-py312
            imagePullPolicy: IfNotPresent
            ports:
              - name: gcs
                containerPort: 6379
              - name: dashboard
                containerPort: 8265
              - name: client
                containerPort: 10001
              - name: metrics
                containerPort: 8080
            resources:
              requests:
                cpu: "1"
                # Reserve the full memory budget to avoid node overcommit.
                memory: 4Gi
              limits:
                cpu: "2"
                memory: 4Gi
            volumeMounts:
              - name: ray-shm
                mountPath: /dev/shm
              - name: ray-tmp
                mountPath: /tmp/ray
        volumes:
          - name: ray-shm
            emptyDir:
              medium: Memory
              sizeLimit: 384Mi
          - name: ray-tmp
            emptyDir: {}

  workerGroupSpecs:
    # Container-layer worker type. Add future types as separate worker groups
    # with a different pyscripts.worker-pool value and suitable image/resources.
    - groupName: default-workers
      replicas: 1
      minReplicas: 1
      maxReplicas: 10
      labels:
        pyscripts.worker-pool: default
      rayStartParams:
        # Match the CPU request; omit the CPU limit to allow spare CPU usage.
        num-cpus: "6"
        # Of the 12Gi container budget: 3Gi object store, 7Gi schedulable
        # task/actor heap, and about 2Gi for Ray processes and other overhead.
        # Ray's memory resource is a scheduling budget, not a per-task limit.
        memory: "7516192768" # 7Gi
        object-store-memory: "3221225472" # 3Gi
      template:
        metadata:
          labels:
            app.kubernetes.io/component: ray-worker
            app.kubernetes.io/part-of: pyscripts
        spec:
          terminationGracePeriodSeconds: 60
          containers:
            - name: ray-worker
              image: rayproject/ray:2.58.0-py312
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: "6"
                  memory: 12Gi
                limits:
                  memory: 12Gi
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: PIP_DISABLE_PIP_VERSION_CHECK
                  value: "1"
              volumeMounts:
                - name: ray-shm
                  mountPath: /dev/shm
                - name: ray-tmp
                  mountPath: /tmp/ray
                - name: pyscripts-runtime-cache
                  mountPath: /tmp/pyscripts-runtime
          volumes:
            # Shared memory usage counts toward the 12Gi container limit.
            # Leave room beyond the 3Gi object store for shared-memory metadata.
            - name: ray-shm
              emptyDir:
                medium: Memory
                sizeLimit: 3584Mi
            - name: ray-tmp
              emptyDir: {}
            - name: pyscripts-runtime-cache
              emptyDir:
                sizeLimit: 20Gi
