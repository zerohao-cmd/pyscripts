apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pyscripts
resources:
  - raycluster.yaml
  - control-plane.yaml
  - services.yaml
  - network-policy.yaml
secretGenerator:
  - name: pyscripts-config
    files:
      - .env
images:
  - name: pyscripts-gateway
    newName: 192.168.0.11:15000/pyscripts/gateway
    newTag: "0.1.1"
