apiVersion: v1
kind: Service
metadata:
  name: pyscripts-http
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pyscripts
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: 8000
      targetPort: http
      appProtocol: http
---
apiVersion: v1
kind: Service
metadata:
  name: pyscripts-grpc
  annotations:
    # Used by the optional K3s/Traefik TLS ingress overlay.
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pyscripts
    app.kubernetes.io/component: control-plane
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
